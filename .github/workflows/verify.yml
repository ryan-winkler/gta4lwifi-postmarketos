name: Non-flashing source checks
on:
  pull_request:
  push:
    branches: [main, 'fix/himax-review-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify packages and applied driver regressions
        env:
          CC: gcc
        run: python3 tests/run.py
